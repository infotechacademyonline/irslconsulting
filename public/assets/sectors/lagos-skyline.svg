<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Lagos skyline stylised">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a3d"/>
      <stop offset="1" stop-color="#1e4bad"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e5fcc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2e5fcc" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#sky)"/>
  <!-- Distant hills -->
  <path d="M0 210 Q 200 190 400 205 T 800 200 T 1200 210 L 1200 260 L 0 260 Z" fill="#0b1a3d" opacity="0.7"/>
